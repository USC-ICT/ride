services:
  faster-whisper:
    build: .
    image: vhtoolkit_faster_whisper
    container_name: faster-whisper
    restart: unless-stopped
    ports:
      - "9005:9005"
    volumes:
      - faster_whisper_cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      MODEL_SIZE: ${MODEL_SIZE:-medium}
      DEVICE: ${DEVICE:-cuda}
      COMPUTE_TYPE: ${COMPUTE_TYPE:-float16}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      DEFAULT_VAD_FILTER: ${DEFAULT_VAD_FILTER:-true}
      API_TOKEN: ${API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  faster_whisper_cache:
