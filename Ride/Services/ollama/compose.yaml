services:
  ollama:
    build: .
    image: vhtoolkit_ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_MODEL_A: ${OLLAMA_MODEL_A:-phi4-mini}
      OLLAMA_MODEL_B: ${OLLAMA_MODEL_B:-qwen3:1.7b}
      # Embedding model, pulled only when set. Needed for semantic retrieval (the RAG proxy,
      # or a Unity project using EmbeddingsSystemOllama); left empty for a plain LLM setup.
      OLLAMA_MODEL_EMBED: ${OLLAMA_MODEL_EMBED:-}
      OLLAMA_KEEP_ALIVE: -1        # keep models resident indefinitely (no auto-unload between requests)
      OLLAMA_MAX_LOADED_MODELS: 2  # hold both models in VRAM for instant hot-swap
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_models:
