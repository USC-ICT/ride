services:
  piper-local-tts:
    build: .
    image: vhtoolkit_piper_tts
    container_name: piper
    restart: unless-stopped
    ports:
      - "9002:9002"
    volumes:
      - piper_cache:/root/.local/share/piper
    environment:
      DEFAULT_VOICE: en_US-lessac-medium
      SUPPORTED_VOICES: en_US-lessac-medium
      API_TOKEN: ${API_TOKEN}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  piper_cache:
