services:
  xtts-local-tts:
    build: .
    image: vhtoolkit_xtts_tts
    container_name: xtts
    restart: unless-stopped
    ports:
      - "9004:9004"
    volumes:
      - xtts_cache:/root/.local/share/tts
      - xtts_hf_cache:/root/.cache/huggingface
    environment:
      DEFAULT_VOICE: Ana Florence
      DEFAULT_LANGUAGE: en
      COQUI_TOS_AGREED: ${COQUI_TOS_AGREED:-1}
      API_TOKEN: ${API_TOKEN}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  xtts_cache:
  xtts_hf_cache:
